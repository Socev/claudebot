# postgrest.conf (wv3180; wv4019: PostgREST 16) — PostgREST achter db-luik.js; zelfde schema-instellingen als het Supabase-project (gemeten 16-11)
db-uri = "postgres://authenticator@/postgres?host=/run/pg&application_name=postgrest"
db-schemas = "public"
db-anon-role = "anon"
db-extra-search-path = "public, extensions"
db-max-rows = 1000
db-pool = 10
db-channel-enabled = true
jwt-secret = "@/opt/data/.pg/jwt.key"
jwt-aud = "db-luik"
# alleen een unix-socket (Codex MOET 1): een TCP-poort op 127.0.0.1 zou elke OS-gebruiker (ook socev) zonder sleutel als anon toelaten.
# Map /run/pgrst is 0700 claude (db-wacht.sh); de luik verbindt via de socket. Geen admin-server (die toont o.a. de configuratie).
server-unix-socket = "/run/pgrst/pgrst.sock"
server-unix-socket-mode = "600"
openapi-mode = "follow-privileges"
log-level = "warn"

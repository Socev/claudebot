# postgrest.conf (wv3180) — PostgREST 14 achter db-luik.js; zelfde schema-instellingen als het Supabase-project (gemeten 16-11)
db-uri = "postgres://authenticator@/postgres?host=/run/pg&application_name=postgrest"
db-schemas = "public"
db-anon-role = "anon"
db-extra-search-path = "public, extensions"
db-max-rows = 1000
db-pool = 10
db-channel-enabled = true
jwt-secret = "@/opt/data/.pg/jwt.key"
jwt-aud = "db-luik"
server-host = "127.0.0.1"
server-port = 3001
admin-server-port = 3002
openapi-mode = "follow-privileges"
log-level = "warn"

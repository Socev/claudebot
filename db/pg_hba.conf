# pg_hba.conf (wv3180) — alleen socket-peer; socev kan niet inloggen (geen pgsock, geen regel), ook niet via 127.0.0.1.
# TYPE  DATABASE     USER                    ADDRESS        METHOD
local   all          pgbaas                                 peer map=beheer
local   all          authenticator,postgres                 peer map=pod
host    replication  reserve                 127.0.0.1/32   scram-sha-256

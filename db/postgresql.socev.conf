# postgresql.socev.conf (wv3180) — ingevoegd via `include` in de postgresql.conf van de datamap (db-wacht.sh zet die regel bij initdb).
# Staat in het image: wijzigen = imagewissel. Ontwerp § 1.
listen_addresses = '127.0.0.1'          # alleen voor de replicatietunnel (beurt C), scram; de pod gebruikt de socket
port = 5432
unix_socket_directories = '/run/pg'     # map 0750 pg:pgsock; claude is lid van pgsock, socev niet
unix_socket_group = 'pgsock'
unix_socket_permissions = 0770
hba_file = '/app/db/pg_hba.conf'
ident_file = '/app/db/pg_ident.conf'
password_encryption = scram-sha-256
max_connections = 60
shared_buffers = 512MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 2GB
jit = off
timezone = 'UTC'
log_timezone = 'UTC'
shared_preload_libraries = 'pg_stat_statements'
# WAL: lokale archiefmap (zstd, 7 dagen) + replicatie naar de R230 (beurt C); het slot mag het volume niet vullen
wal_level = replica
archive_mode = on
archive_command = '/app/db/wal-archief.sh %p %f'
archive_timeout = 60
max_wal_senders = 4
max_replication_slots = 4
max_slot_wal_keep_size = 4GB
wal_compression = zstd
# logs op het volume (leesbaar voor pgsock), zonder query-inhoud
logging_collector = on
log_directory = '/opt/data/pg/log'
log_filename = 'postgresql-%a.log'
log_file_mode = 0640
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_connections = off
log_statement = 'none'
# Codex MOET 4: ook bij een fout geen SQL-tekst (kan sleutels of persoonsgegevens bevatten) en geen DETAIL/CONTEXT (kan waarden tonen)
log_min_error_statement = panic
log_error_verbosity = terse
# kluissleutel: pad, nooit de sleutel zelf (vault._sleutel() leest hem)
socev.kluis_pad = '/opt/data/pg/kluis.key'

name: promote
# Zet de tag :stabiel op een al gebouwd en getest image (3-10-2026).
# Gebruik: git tag stabiel-<run_number> && git push origin stabiel-<run_number>
# De chart draait ghcr.io/socev/claudebot:stabiel met imagePullPolicy Always: bij de volgende
# containerstart haalt de pod dit image. Terugzetten = een oudere stabiel-<n>-tag pushen (nieuwe tagnaam,
# bv. stabiel-52-terug) of opnieuw dezelfde n met een achtervoegsel.
on:
  push:
    tags: [ 'stabiel-*' ]
jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Tag stabiel zetten
        run: |
          N="${GITHUB_REF_NAME#stabiel-}"; N="${N%%-*}"
          echo "bron: ghcr.io/socev/claudebot:$N"
          docker buildx imagetools inspect "ghcr.io/socev/claudebot:$N" >/dev/null
          docker buildx imagetools create -t ghcr.io/socev/claudebot:stabiel "ghcr.io/socev/claudebot:$N"
          docker buildx imagetools inspect ghcr.io/socev/claudebot:stabiel | head -5

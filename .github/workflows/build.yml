      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Eerst alleen LOKAAL bouwen; pas na de rooktests gaat het image naar ghcr (stap
      # "Pushen" onderaan). Tot 23-9-2026 werd er eerst gepusht en dan getest, zodat een
      # image dat de test niet haalde toch al als :latest klaarstond.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/socev/claudebot:latest
            ghcr.io/socev/claudebot:${{ github.run_number }}

      # ── Rooktest ─────────────────────────────────────────────────────────
      #
      # WAAROM DEZE STAP BESTAAT. Tot nu toe was de eerste keer dat een image echt
      # startte, de keer dat het op de pod startte. Een tikfout in run.sh of een
      # supervisor die niet opkomt merkte je pas als de pod al plat lag - en dan is
      # het gereedschap om het te repareren ook weg.
      #
      # WAAROM MET EXACT EN ALLEEN DE CHART-ENV. De verleiding is hier alles in te
      # vullen wat de container maar zou kunnen willen. Dan slaagt de test altijd
      # en vertelt hij niets. Door precies te leveren wat de chart levert, faalt
      # deze stap zodra de code een NIEUWE variabele nodig heeft - in CI, waar dat
      # niets kost, in plaats van op de pod.
      #
      # DE LIJST IS GEVERIFIEERD TEGEN DE CHART (deployment.yaml), 19-8-2026. Het zijn
      # exact deze zeventien namen, en niets anders. Geen enkel werktoken zit erbij:
      # die komen via fetch-secrets uit de Vault en horen hier dus niet.
      #
      # WAAROM TWEE CONTROLES EN NIET EEN. Gemeten op 19-8-2026: met exact de chart-env
      # en een LEGE POD_BOOTSTRAP_SECRET valt fetch-secrets.sh NIET in overgangsmodus
      # maar sluit hij af met exit 78. Dat is geen bug maar het ontwerp - overgangsmodus
      # eist dat CLAUDE_CODE_OAUTH_TOKEN al in de omgeving staat, en die komt uit de
      # kluis. Met alleen de chart-env kan de volledige keten dus per definitie niet
      # doorstarten. Een werktoken erbij verzinnen zou die meting wegpoetsen en precies
      # de indruk wekken die we willen vermijden: dat CI het laden van secrets test.
      #
      # Daarom:
      #   A. de VOLLEDIGE keten met alleen de chart-env moet met 78 afsluiten. Dat
      #      toetst de fail-hard: de pod hoort te weigeren half-geauthenticeerd te
      #      draaien, in plaats van vaag ziek door te starten.
      #   B. dezelfde env, maar de keten begint bij run.sh, zodat supervisor, app en
      #      /health wel getest worden. Dit stuk zegt niets over secrets - de assertie
      #      op een LEGE secrets_geladen staat erin zodat niemand later denkt van wel.
      - name: Rooktest - fail-hard en /health
        env:
          VERWACHTE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/socev/claudebot:${{ github.run_number }}

          # Exact de zeventien namen uit de chart. Waardes zijn nep en als zodanig
          # herkenbaar; POD_BOOTSTRAP_SECRET is leeg, zoals de chart hem in CI zou
          # leveren als er geen kluis is.
          cat > /tmp/chart.env <<'ENVEOF'
          PGID=1001
          PUID=1001
          TZ=Europe/Amsterdam
          TG_ALLOWED=NEP-CI-GEEN-ECHTE-CHAT
          VAULT_DIR=/opt/data/AI_SecondBrain
          PORT=8080
          API_SECRET=NEP-CI-WAARDE-GEEN-ECHT-SECRET
          DISABLE_AUTOUPDATER=1
          POD_BOOTSTRAP_SECRET=
          SUPABASE_URL=https://nep-ci.invalid
          SUPABASE_ANON_KEY=NEP-CI-WAARDE-GEEN-ECHTE-SLEUTEL
          GIT_REPO_URL=https://nep-ci.invalid/geen-repo.git
          REPO_DIR=/opt/data/repo
          GIT_USER_NAME=rooktest
          GIT_USER_EMAIL=rooktest@nep-ci.invalid
          AGENT_WEBHOOK_URL=https://nep-ci.invalid/webhook
          AGENT_WEBHOOK_SECRET=NEP-CI-WAARDE-GEEN-ECHT-SECRET
          ENVEOF
          sed -i 's/^          //' /tmp/chart.env

          echo "== A. volledige keten met alleen de chart-env: moet 78 geven =="
          set +e
          docker run --name rooktest-keten --env-file /tmp/chart.env "$IMAGE" >/tmp/keten.log 2>&1
          CODE=$?
          set -e
          echo "exitcode: $CODE"; tail -5 /tmp/keten.log || true
          if [ "$CODE" != "78" ]; then
            echo "::error::fail-hard werkt niet: verwacht exit 78 zonder bootstrapgeheim, kreeg $CODE"
            exit 1
          fi
          grep -q 'FATAAL' /tmp/keten.log || { echo "::error::exit 78 zonder FATAAL-regel in het log"; exit 1; }
          echo "  OK    keten weigert te starten zonder kluis, met een leesbare reden"

          echo "== B. supervisor + app + /health, zelfde env, keten vanaf run.sh =="
          # Dit spiegelt entrypoint.sh (mappen aanmaken + chown) en slaat alleen
          # fetch-secrets over. Wijzigt entrypoint.sh, dan moet deze regel mee - er is
          # bewust geen bypass-vlag in fetch-secrets zelf, want dat zou een schakelaar
          # zijn om het laden van secrets over te slaan.
          docker run -d --name rooktest -p 18080:8080 --env-file /tmp/chart.env \
            --entrypoint /bin/bash "$IMAGE" -c \
            'mkdir -p /opt/data/bin /opt/data/io /opt/data/AI_SecondBrain "${REPO_DIR:-/opt/data/repo}" && chown -R claude:claude /opt/data && /app/socev-voorbereiding.sh && exec gosu claude /app/run.sh'

          echo "wachten tot /health antwoordt (max 90 s)"
          for i in $(seq 1 90); do
            if curl -fsS -m 3 http://127.0.0.1:18080/health -o /tmp/health.json 2>/dev/null; then
              echo "antwoord na ${i}s"; break
            fi
            sleep 1
          done

          echo "-- containerlog (staart) --"; docker logs rooktest 2>&1 | tail -40
          echo "-- /health --"; cat /tmp/health.json 2>/dev/null || echo "(geen antwoord)"; echo

          node -e '
            const fs = require("fs");
            let j;
            try { j = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8")); }
            catch (e) {
              console.error("::error::/health gaf geen bruikbare JSON - de container is niet gezond opgekomen");
              process.exit(1);
            }
            const eisen = [
              ["ok is true", j.ok === true],
              // Een verse container heeft geen releases op het volume. Dat versie
              // toch gevuld is, kan dus alleen als de supervisor de bootstrapkopie
              // heeft uitgepakt en current heeft gezet.
              ["versie is gevuld", !!j.versie && j.versie !== "onbekend"],
              ["versie == image_versie (vers volume draait de bootstrapkopie)", j.versie === j.image_versie],
              ["versie == de gebouwde commit", j.versie === process.env.VERWACHTE_SHA],
              // Zonder bootstrapgeheim hoort er niets uit de kluis te komen. Slaat
              // dit om, dan test deze stap iets anders dan hij beweert.
              ["secrets_geladen is leeg (geen kluis in CI)",
               Array.isArray(j.secrets_geladen) && j.secrets_geladen.length === 0],
              // Uitwijk stap 3: zonder bereikbare Supabase start de pod PASSIEF (fail-closed), en dit image heeft
              // de rolpoort in run.sh.
              ["rol passief zonder kluis (fail-closed)", j.rol === "passief" && j.kant === "olares"],
              ["run.sh in dit image heeft de rolpoort", j.uitwijk && j.uitwijk.runsh_poort === true]
            ];
            let stuk = 0;
            for (const [naam, goed] of eisen) {
              console.log((goed ? "  OK    " : "  FOUT  ") + naam);
              if (!goed) stuk++;
            }
            if (stuk) {
              console.error("::error::rooktest: " + stuk + " van de " + eisen.length + " eisen niet gehaald");
              process.exit(1);
            }
            console.log("rooktest geslaagd - draaiende versie " + j.versie);
          '

      # WAAROM DEZE STAP BESTAAT (23-9-2026). De Claude Code-CLI is bewust niet vastgepind:
      # elk nieuw image pakt de nieuwste. Dat is goed (nieuwe modellen, zoals Opus 5.5 dat
      # CLI >= 2.1.280 eist), maar een nieuwe CLI kan ook een vlag schrappen of hernoemen
      # waar server.js op leunt. Dan faalt elke beurt pas op de pod. Hier dus: de versie
      # mag niet terug, en de vier vlaggen die runClaude gebruikt moeten nog bestaan.
      - name: Rooktest - Claude Code-CLI
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/socev/claudebot:${{ github.run_number }}
          MINIMUM=2.1.280
          VERSIE=$(docker run --rm --entrypoint claude "$IMAGE" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Claude Code in dit image: ${VERSIE:-onleesbaar}"
          if [ -z "$VERSIE" ] || [ "$(printf '%s\n%s\n' "$MINIMUM" "$VERSIE" | sort -V | head -1)" != "$MINIMUM" ]; then
            echo "::error::Claude Code ${VERSIE:-onleesbaar} is ouder dan $MINIMUM (nodig voor Opus 5.5)"; exit 1
          fi
          HULP=$(docker run --rm --entrypoint claude "$IMAGE" --help)
          for vlag in --output-format --permission-mode --resume --effort; do
            if ! grep -qF -- "$vlag" <<<"$HULP"; then echo "::error::Claude Code kent de vlag $vlag niet meer - runClaude in server.js leunt erop"; exit 1; fi
            echo "  OK    $vlag"
          done
          docker run --rm --entrypoint cat "$IMAGE" /app/cli-versies.txt | tee -a "$GITHUB_STEP_SUMMARY"

      # Derde brein (27-9-2026): de Antigravity CLI ('agy') wordt niet gepind en kan dus
      # met een nieuw image een vlag verliezen. runGemini in server.js leunt op deze vlaggen;
      # ontbreekt er een, dan faalt hier de build in plaats van elke Gemini-beurt op de pod.
      - name: Rooktest - Antigravity CLI (Gemini)
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/socev/claudebot:${{ github.run_number }}
          docker run --rm --entrypoint test "$IMAGE" -x /usr/local/bin/agy || { echo "::error::/usr/local/bin/agy ontbreekt in het image"; exit 1; }
          VERSIE=$(docker run --rm --entrypoint agy "$IMAGE" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          echo "agy in dit image: ${VERSIE:-onleesbaar}"
          [ -n "$VERSIE" ] || { echo "::error::agy --version gaf geen versienummer"; exit 1; }
          HULP=$(docker run --rm --entrypoint agy "$IMAGE" --help 2>&1 || true)
          for vlag in -p --print --output-format --dangerously-skip-permissions --conversation --model --effort; do
            if ! grep -qE -- "^[[:space:]]+${vlag}([[:space:]]|$)" <<<"$HULP"; then echo "::error::agy kent de vlag $vlag niet meer - runGemini in server.js leunt erop"; exit 1; fi
            echo "  OK    $vlag"
          done

      # WAAROM (wv699, 21-10-2026). Uid-scheiding fase 1: een tweede gebruiker socev (1002) die straks de smalle
      # Socev-gesprekken draait, zodat een prompt-injectie niet bij de pod-sleutels kan (/proc/<pid>/environ, kluis, bunq).
      # Deze stap draait het ECHTE entrypoint (alleen fetch-secrets is in de toets vervangen door een doorgeefluik) op een
      # volume met nepbestanden op de gevoelige plekken, en toetst als 1002: niets van 1001 leesbaar, .claude/ in de vault
      # niet schrijfbaar, de rest van de vault wel (en 1001 kan het daarna lezen), de loper-socket alleen voor 1001, de
      # loper als 1002 zonder capabilities, binnen 5 s terug na een kill, en 1001 werkt als vandaag. Plus een herstart.
      # WAAROM (wv813, 22-10-2026). De vault gaat via rclone bisync naar Google Drive en zo naar Davids pc. bisync-filter.txt
      # houdt scripts en Windows-code (ook een bestand van claude dat een socev-gesprek vulde en hernoemde) van Drive. Deze
      # stap draait in het image een echte bisync tussen twee proefmappen met /app/bisync-filter.txt, de zelftoets (ook tegen
      # de WINCODE-lijst van /app/socev-rechten.sh) en controleert dat /app/run.sh het filter bij elke bisync meegeeft.
      - name: "Rooktest - syncfilter vault (wv813)"
        run: |
          docker run --rm -v "$PWD":/src:ro --entrypoint bash ghcr.io/socev/claudebot:${{ github.run_number }} \
            /src/test/bisync-filter.sh /app/bisync-filter.txt /app/run.sh

      # WAAROM (wv1854, 28-10-2026). Download als… (omzet.js) zet tekst om met pandoc en de headless Chromium uit het image (JS uit,
      # netwerk dicht, één tegelijk). Die zijn er alleen in het image in dezelfde versie als op de pod; daarom draait test/omzet.sh hier,
      # als claude (zoals server.js).
      - name: "Rooktest - Download als (wv1854, omzet.js)"
        run: |
          docker run --rm -v "$PWD":/src:ro --user claude --entrypoint bash ghcr.io/socev/claudebot:${{ github.run_number }} /src/test/omzet.sh

      # WAAROM (wv1308, 26-10-2026). bisync met Drive gaat uit via het schakelbestand /opt/data/bisync.json (ontwerp OVIS Intake
      # § 11.4 stap 0). Een ontbrekend of kapot bestand, {"aan": false} of de onderhoudsstand van de vault mag nooit een ronde,
      # zelfherstel-resync of eerste koppeling geven; de stand wordt ook onder de vault-grendel gelezen. Deze stap draait het
      # sync-deel van /app/run.sh in scenario's met een nep-rclone (als root: ook "andere eigenaar") en /health.sync uit server.js.
      - name: "Rooktest - schakelbestand bisync (wv1308)"
        run: |
          docker run --rm -v "$PWD":/src:ro --entrypoint bash ghcr.io/socev/claudebot:${{ github.run_number }} \
            /src/test/bisync-schakelaar.sh /app/run.sh

      # WAAROM (wv1277, 25-10-2026). De vault gaat ook via Syncthing naar de Synology en Davids pc's. syncthing-stignore.txt moet
      # weglaten wat bisync-filter.txt weglaat; run.sh start Syncthing alleen als syncthing-filter-toets.py groen is. Deze stap
      # haalt dezelfde Syncthing-release als de pod (vaste sha256, gelijk aan ST_SHA256 in run.sh) en draait in het image: de
      # filtertoets op /app, de tegenproeven (kapotte filters moeten rood zijn), rechten/symlink/filter met twee echte
      # instanties, en het Syncthing-blok van run.sh in scenario's.
      - name: "Rooktest - Syncthing-filter en -poort (wv1277)"
        run: |
          curl -fsSL -o /tmp/st.tgz https://github.com/syncthing/syncthing/releases/download/v2.1.7/syncthing-linux-amd64-v2.1.7.tar.gz
          echo "2edc416e7ed136b7c858ed5f3f02a3b8316589605e54c380228ceea7acbf0142  /tmp/st.tgz" | sha256sum -c -
          mkdir -p /tmp/stbin && tar -xzf /tmp/st.tgz -C /tmp/stbin --strip-components=1 syncthing-linux-amd64-v2.1.7/syncthing
          PIN=$(grep -oE '^ST_SHA256=[0-9a-f]{64}' run.sh | cut -d= -f2)
          [ "$(sha256sum /tmp/stbin/syncthing | cut -d' ' -f1)" = "$PIN" ] || { echo "::error::ST_SHA256 in run.sh is niet de sha256 van syncthing v2.1.7"; exit 1; }
          chmod 0755 /tmp/stbin /tmp/stbin/syncthing
          docker run --rm -v "$PWD":/src:ro -v /tmp/stbin:/stbin:ro --user claude --entrypoint bash ghcr.io/socev/claudebot:${{ github.run_number }} -c '
            set -e
            python3 -I /app/syncthing-filter-toets.py --stignore /app/syncthing-stignore.txt --bisync /app/bisync-filter.txt --rechten /app/socev-rechten.sh --syncthing /stbin/syncthing
            bash /src/test/syncthing-filter.sh /stbin/syncthing /app/syncthing-stignore.txt /app/bisync-filter.txt
            bash /src/test/syncthing-rechten.sh /stbin/syncthing /app/syncthing-stignore.txt
            bash /src/test/syncthing-runsh.sh /stbin/syncthing'

      - name: "Rooktest - uid-scheiding (wv699)"
        run: |
          bash test/uid-scheiding.sh ghcr.io/socev/claudebot:${{ github.run_number }} /tmp/chart.env

      - name: Rooktest opruimen
        if: always()
        run: |
          docker rm -f rooktest rooktest-keten 2>/dev/null || true
          rm -f /tmp/chart.env /tmp/keten.log /tmp/health.json 2>/dev/null || true

      # Pas hier, na geslaagde rooktests, gaat het image naar ghcr. Faalt een test, dan
      # slaat GitHub deze stap over en blijft :latest het vorige, geteste image.
      - name: Pushen (alleen na geslaagde rooktests)
        run: |
          set -euo pipefail
          docker push ghcr.io/socev/claudebot:${{ github.run_number }}
          docker push ghcr.io/socev/claudebot:latest

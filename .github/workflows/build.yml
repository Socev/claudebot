name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # wv1044: prestatiegrenzen in de toetsen gelden voor de pod; deze runner is trager en wisselt (runs 239–253 rood op 3,1–3,9 s
    # tegen 3 s). De toetsen vermenigvuldigen hun tijdgrens met deze factor; lokaal is hij 1.
    env:
      TOETS_TIJDFACTOR: '3'
    steps:
      - uses: actions/checkout@v4

      # De Telegram-lezer moet ALLEEN kunnen lezen. Dat is geen eigenschap van de
      # credential - dezelfde MTProto-sessie kan gewoon versturen - maar van de
      # code. Deze stap is de poort eromheen: komt er ooit een verzend- of
      # markeerfunctie in telegram-reader.js, dan faalt de build en komt het niet
      # in een image terecht. koppel-telegram.js valt hier bewust buiten: dat
      # script moet wel kunnen inloggen (signIn).
      - name: telegram-reader.js moet alleen-lezen blijven
        if: ${{ !cancelled() }}
        run: |
          if grep -nE 'sendMessage|forwardMessages|readHistory|markAsRead|sendFile' telegram-reader.js; then
            echo "::error::telegram-reader.js bevat een verzend- of markeerfunctie. Dit luik is alleen-lezen."
            exit 1
          fi
          echo "telegram-reader.js: geen verzend- of markeerfuncties gevonden."

      # Zelfde poort voor de bankluis (wv680): bank-lezer.js mag alleen lezen. Geen betaal-endpoint van Enable Banking
      # (/payments, /payment-…) en geen andere schrijvende methode dan POST /auth, POST /sessions en DELETE /sessions.
      - name: bank-lezer.js moet alleen-lezen blijven
        if: ${{ !cancelled() }}
        run: |
          if grep -nEi "payment|['\"](PUT|PATCH)['\"]" bank-lezer.js | grep -vE '^\s*[0-9]+:\s*(\*|//)'; then
            echo "::error::bank-lezer.js bevat een betaal- of schrijfroute. Dit luik is alleen-lezen."
            exit 1
          fi
          # DELETE alleen op /sessions/ (ontkoppelen); POST alleen op /auth en /sessions
          if grep -nE "api\('DELETE'" bank-lezer.js | grep -v "'/sessions/'"; then echo "::error::DELETE buiten /sessions"; exit 1; fi
          if grep -nE "api\('POST'" bank-lezer.js | grep -vE "'/(auth|sessions)'"; then echo "::error::POST buiten /auth en /sessions"; exit 1; fi
          echo "bank-lezer.js: geen betaalroutes gevonden."

      # bunq-lezer.js (wv683): de bunq-sleutel kan betalen, dus dit bestand mag precies twee dingen: GET op de witte lijst
      # (monetary-account[-bank|-savings|-joint] en .../payment = de transactielijst) en POST /v1/session-server. Geen
      # PUT/PATCH/DELETE, geen andere POST, geen betaal-objecten (draft-, schedule-, request-, batch-, card-, …).
      - name: bunq-lezer.js moet alleen-lezen blijven
        if: ${{ !cancelled() }}
        run: |
          C=$(grep -vE '^\s*(\*|//)' bunq-lezer.js)
          if echo "$C" | grep -nEi "['\"](PUT|PATCH|DELETE)['\"]|draft-payment|schedule-payment|payment-batch|request-inquiry|request-response|bunqme|/card|/whitelist|credential-password-ip|/ip\b|attachment|note-text"; then
            echo "::error::bunq-lezer.js bevat een schrijf- of betaalroute. Dit luik is alleen-lezen."; exit 1
          fi
          if echo "$C" | grep -nE "[\"'\`]POST[\"'\`]" | grep -vE "methode === 'POST'|'/v1/session-server'"; then echo "::error::POST buiten /v1/session-server"; exit 1; fi
          if [ "$(echo "$C" | grep -c "roep(ctx, 'POST'")" != "1" ]; then echo "::error::meer dan één POST-aanroep in bunq-lezer.js"; exit 1; fi
          # één netwerkaanroep, en die gaat altijd eerst door padToets
          if [ "$(echo "$C" | grep -cE "\bfetch\(")" != "1" ] || ! echo "$C" | grep -qE "const url = padToets\(methode, padQuery"; then echo "::error::fetch buiten roep() of zonder padToets"; exit 1; fi
          if echo "$C" | grep -nE "\b(http|https|net|tls|undici)\b'\)|require\('(node:)?(http|https|net|tls|child_process)'" ; then echo "::error::bunq-lezer.js mag geen eigen netwerk- of procesmodules laden"; exit 1; fi
          echo "bunq-lezer.js: alleen lezen."

      # bank-archief.js (wv687): de transactiedatabase is puur lokaal. Geen netwerk- of procesmodule en geen fetch: het archief
      # kan per constructie niets naar een bank of elders sturen (ook niet als een AI-oordeel of omschrijving iets anders vraagt).
      - name: bank-archief.js moet lokaal blijven
        if: ${{ !cancelled() }}
        run: |
          C=$(grep -vE '^\s*(\*|//)' bank-archief.js)
          if echo "$C" | grep -nE "require\(['\"](node:)?(http|https|net|tls|dgram|dns|child_process|worker_threads|undici)['\"]\)|\bfetch\s*\(|process\.binding|import\("; then
            echo "::error::bank-archief.js laadt een netwerk- of procesmodule; het archief moet lokaal blijven"; exit 1
          fi
          echo "bank-archief.js: alleen lokaal."

      # paypal-bewijs.js (wv765): de PayPal-laag leest mailtekst (gegeven, geen opdracht) en schrijft alleen in de transactiedatabase.
      # Zelfde poort als bank-archief.js: geen netwerk- of procesmodule, geen fetch; ophalen doet server.js via het lees-luik.
      - name: paypal-bewijs.js moet lokaal blijven
        if: ${{ !cancelled() }}
        run: |
          C=$(grep -vE '^\s*(\*|//)' paypal-bewijs.js)
          if echo "$C" | grep -nE "require\(['\"](node:)?(http|https|net|tls|dgram|dns|child_process|worker_threads|undici)['\"]\)|\bfetch\s*\(|process\.binding|import\("; then
            echo "::error::paypal-bewijs.js laadt een netwerk- of procesmodule; de PayPal-laag moet lokaal blijven"; exit 1
          fi
          echo "paypal-bewijs.js: alleen lokaal."

      # pot-afschrift.js en mt940-lezer.js (wv787): de afschriftmaker van de POT-rekening is puur (invoer erin, MT940 + PDF eruit). Geen
      # bestand-, netwerk- of procesmodule en geen fetch: bestanden schrijft bank-lezer.js, versturen doet niemand (een concept maakt server.js).
      - name: pot-afschrift.js en mt940-lezer.js moeten puur blijven
        if: ${{ !cancelled() }}
        run: |
          for f in pot-afschrift.js mt940-lezer.js; do
            C=$(grep -vE '^\s*(\*|//)' "$f")
            if echo "$C" | grep -nE "require\(['\"](node:)?(fs|http|https|net|tls|dgram|dns|child_process|worker_threads|undici)['\"]\)|\bfetch\s*\(|process\.binding|import\("; then
              echo "::error::$f laadt een bestand-, netwerk- of procesmodule; de afschriftmaker moet puur blijven"; exit 1
            fi
          done
          echo "pot-afschrift.js en mt940-lezer.js: puur."

      # facturen-kern.js (wv797, Facturen-app F1a): de kern beslist (entiteit, betaalwijze, controles) en is puur: geen bestand-, netwerk- of
      # procesmodule, geen fetch en geen klok (vandaag/nu komen van de beller). Opslaan doet facturen-db.js, mail en versturen de koerier.
      # facturen-bank.js (wv798, F1b): bankparsers, matching en signalen; zelfde poort, en hij mag alleen de pure buren laden
      # (facturen-kern.js, mt940-lezer.js). Een signaal geeft hooguit een tekst om te kopiëren: niets betaalt of mailt.
      - name: facturen-kern.js en facturen-bank.js moeten puur blijven
        if: ${{ !cancelled() }}
        run: |
          for f in facturen-kern.js facturen-bank.js facturen-validatie.js facturen-sepa.js facturen-specificatie.js; do
            C=$(grep -vE '^\s*(\*|//)' "$f")
            if echo "$C" | grep -nE "require\([\`'\"](node:)?(fs(/promises)?|os|http|https|net|tls|dgram|dns|child_process|worker_threads|cluster|vm|undici)[\`'\"]\)|\bfetch\s*\(|process\.|import\("; then
              echo "::error::$f laadt een bestand-, netwerk- of procesmodule; de kern moet puur blijven"; exit 1
            fi
            # klok: Date.now(), new Date() / new Date zonder argument, Date() als functie, format() zonder datum, Math.random
            if echo "$C" | sed 's/new Date(\s*[^)[:space:]]/NIEUWEDATUM(/g' | grep -nE "Date\.now\s*\(|new Date\b|(^|[^.A-Za-z0-9_])Date\(|\.format(ToParts)?\(\s*\)|Math\.random"; then
              echo "::error::$f leest zelf de klok of het toeval; geef vandaag/nu mee"; exit 1
            fi
          done
          # facturen-bank.js laadt alleen crypto en de pure buren
          if grep -vE '^\s*(\*|//)' facturen-bank.js | grep -oE "require\([^)]*\)" | grep -vE "^require\('(crypto|\./mt940-lezer\.js|\./facturen-kern\.js)'\)$"; then
            echo "::error::facturen-bank.js laadt een module buiten crypto, mt940-lezer.js en facturen-kern.js"; exit 1
          fi
          # facturen-validatie.js (wv944): factuurvalidatie op de bankhistorie; laadt alleen de kern
          if grep -vE '^\s*(\*|//)' facturen-validatie.js | grep -oE "require\([^)]*\)" | grep -vE "^require\('\./facturen-kern\.js'\)$"; then
            echo "::error::facturen-validatie.js laadt een module buiten facturen-kern.js"; exit 1
          fi
          # facturen-sepa.js (wv1405): maakt het pain.001-bestand van de SEPA-batch; laadt alleen crypto (sha256). Betaalt of verstuurt niets.
          if grep -vE '^\s*(\*|//)' facturen-sepa.js | grep -oE "require\([^)]*\)" | grep -vE "^require\('crypto'\)$"; then
            echo "::error::facturen-sepa.js laadt een module buiten crypto"; exit 1
          fi
          # facturen-specificatie.js (wv2025): PDF en mailtekst van de specificatie per SEPA-batch voor de boekhouder; laadt alleen crypto.
          # Versturen doet hij niet: server.js zet een Gmail-concept klaar, David verstuurt.
          if grep -vE '^\s*(\*|//)' facturen-specificatie.js | grep -oE "require\([^)]*\)" | grep -vE "^require\('crypto'\)$"; then
            echo "::error::facturen-specificatie.js laadt een module buiten crypto"; exit 1
          fi
          echo "facturen-kern.js, facturen-bank.js, facturen-validatie.js, facturen-sepa.js en facturen-specificatie.js: puur."

      # pot-datahub.js (wv815): POT-posten naar Davids datahub. Puur: geen bestand-, netwerk- of procesmodule, geen fetch en geen klok
      # (vandaag komt van server.js); alleen crypto en mt940-lezer.js. Schrijven in D1 doet server.js, altijd met parameters.
      - name: pot-datahub.js moet puur blijven
        if: ${{ !cancelled() }}
        run: |
          C=$(grep -vE '^\s*(\*|//)' pot-datahub.js)
          if echo "$C" | grep -nE "require\([\`'\"](node:)?(fs(/promises)?|os|http|https|net|tls|dgram|dns|child_process|worker_threads|cluster|vm|undici)[\`'\"]\)|\bfetch\s*\(|process\.|import\("; then
            echo "::error::pot-datahub.js laadt een bestand-, netwerk- of procesmodule; de module moet puur blijven"; exit 1
          fi
          if echo "$C" | sed 's/new Date(\s*[^)[:space:]]/NIEUWEDATUM(/g' | grep -nE "Date\.now\s*\(|new Date\b|(^|[^.A-Za-z0-9_])Date\(|Math\.random"; then
            echo "::error::pot-datahub.js leest zelf de klok of het toeval; geef vandaag mee"; exit 1
          fi
          if echo "$C" | grep -oE "require\([^)]*\)" | grep -vE "^require\('(crypto|\./mt940-lezer\.js)'\)$"; then
            echo "::error::pot-datahub.js laadt een module buiten crypto en mt940-lezer.js"; exit 1
          fi
          echo "pot-datahub.js: puur."
      # pot-verzend.js (wv911): nota's uit Davids POT-app als Gmail-concept klaarzetten. Puur: alleen crypto; D1, lees-luik, mailluik,
      # pdftotext, vault, Voor jou en het conceptregister komen van server.js (io). Geen eigen klok: tijden komen van D1.
      - name: pot-verzend.js moet puur blijven
        if: ${{ !cancelled() }}
        run: |
          C=$(grep -vE '^\s*(\*|//)' pot-verzend.js)
          if echo "$C" | grep -nE "require\([\`'\"](node:)?(fs(/promises)?|os|http|https|net|tls|dgram|dns|child_process|worker_threads|cluster|vm|undici)[\`'\"]\)|\bfetch\s*\(|process\.|import\("; then
            echo "::error::pot-verzend.js laadt een bestand-, netwerk- of procesmodule; de module moet puur blijven"; exit 1
          fi
          if echo "$C" | sed 's/new Date(\s*[^)[:space:]]/NIEUWEDATUM(/g' | grep -nE "Date\.now\s*\(|new Date\b|(^|[^.A-Za-z0-9_])Date\(|Math\.random"; then
            echo "::error::pot-verzend.js leest zelf de klok of het toeval; tijden komen van D1"; exit 1
          fi
          if echo "$C" | grep -oE "require\([^)]*\)" | grep -vE "^require\('crypto'\)$"; then
            echo "::error::pot-verzend.js laadt een module buiten crypto"; exit 1
          fi
          echo "pot-verzend.js: puur."

      # facturen-db.js (wv824, F1c): de opslag van de Facturen-app is lokaal (SQLite + stukken op de pod). Geen netwerk- of procesmodule en
      # geen fetch; hij laadt alleen fs, path, crypto, node:sqlite en de pure buren. Versturen doet de koerier (F4), nooit de opslag.
      - name: facturen-db.js moet lokaal blijven
        if: ${{ !cancelled() }}
        run: |
          C=$(grep -vE '^\s*(\*|//)' facturen-db.js)
          if echo "$C" | grep -nE "require\([\`'\"](node:)?(http|https|net|tls|dgram|dns|child_process|worker_threads|cluster|vm|undici)[\`'\"]\)|\bfetch\s*\(|process\.(binding|dlopen)|import\("; then
            echo "::error::facturen-db.js laadt een netwerk- of procesmodule; de opslag moet lokaal blijven"; exit 1
          fi
          if grep -vE '^\s*(\*|//)' facturen-db.js | grep -oE "require\([^)]*\)" | grep -vE "^require\('(fs|path|crypto|node:sqlite|\./facturen-kern\.js|\./facturen-bank\.js)'\)$"; then
            echo "::error::facturen-db.js laadt een module buiten fs, path, crypto, node:sqlite en de pure buren"; exit 1
          fi
          echo "facturen-db.js: alleen lokaal."

      # facturen.js (wv833, F2): de routes van de Facturen-app. Ook lokaal: geen netwerk- of procesmodule en geen fetch (versturen doet de
      # koerier in F4); hij laadt alleen fs, node:sqlite (de read-only bankluis-verbinding) en de drie Facturen-buren.
      - name: facturen.js moet lokaal blijven
        if: ${{ !cancelled() }}
        run: |
          C=$(grep -vE '^\s*(\*|//)' facturen.js)
          if echo "$C" | grep -nE "require\([\`'\"](node:)?(http|https|net|tls|dgram|dns|child_process|worker_threads|cluster|vm|undici)[\`'\"]\)|\bfetch\s*\(|process\.(binding|dlopen)|import\("; then
            echo "::error::facturen.js laadt een netwerk- of procesmodule; de routes moeten lokaal blijven"; exit 1
          fi
          if grep -vE '^\s*(\*|//)' facturen.js | grep -oE "require\([^)]*\)" | grep -vE "^require\('(fs|node:sqlite|\./facturen-kern\.js|\./facturen-bank\.js|\./facturen-db\.js|\./facturen-validatie\.js|\./facturen-sepa\.js|\./facturen-specificatie\.js|\./facturen-creditcard\.js)'\)$"; then
            echo "::error::facturen.js laadt een module buiten fs, node:sqlite en de Facturen-buren"; exit 1
          fi
          echo "facturen.js: alleen lokaal."

      # facturen-koerier.js (wv855, F4): de koerier van de Facturen-app. Positieve poort: alleen crypto, child_process (één execFile van
      # /usr/bin/pdftotext, PDF op stdin, tekst op stdout) en de Facturen-buren; geen fetch en geen fs: het lees-luik en de verzender komen als
      # functies uit server.js, de stukken leest facturen-db.js. Zo kan hij niets anders aanroepen dan pdftotext.
      - name: facturen-koerier.js alleen pdftotext
        if: ${{ !cancelled() }}
        run: |
          C=$(grep -vE '^\s*(\*|//)' facturen-koerier.js)
          if echo "$C" | grep -nE "require\([\`'\"](node:)?(http|https|net|tls|dgram|dns|worker_threads|cluster|vm|undici|fs|fs/promises)[\`'\"]\)|\bfetch\s*\(|process\.(binding|dlopen)|import\(|execSync|spawnSync|\bspawn\s*\(|[^.]\bexec\s*\("; then
            echo "::error::facturen-koerier.js laadt een netwerk-, bestands- of andere procesmodule"; exit 1
          fi
          if grep -vE '^\s*(\*|//)' facturen-koerier.js | grep -oE "require\([^)]*\)" | grep -vE "^require\('(crypto|child_process|\./facturen-kern\.js|\./facturen-db\.js|\./facturen\.js)'\)$"; then
            echo "::error::facturen-koerier.js laadt een module buiten crypto, child_process en de Facturen-buren"; exit 1
          fi
          if [ "$(grep -vE '^\s*(\*|//)' facturen-koerier.js | grep -c 'execFile(')" != "1" ] || ! grep -q "^const PDFTOTEXT = '/usr/bin/pdftotext';$" facturen-koerier.js; then
            echo "::error::facturen-koerier.js: child_process alleen voor één execFile van /usr/bin/pdftotext"; exit 1
          fi
          echo "facturen-koerier.js: alleen pdftotext."
      # facturen-ingang.js (wv856, F6): de smalle ingang /fac voor de praktijkmanager. Geen netwerk- of procesmodule, geen fetch en geen
      # console (de certs van Access komen uit server.js); de gebruikers-JWT en het Access-bewijs gaan alleen naar controleerJwt, nooit
      # in een log, audit of antwoord (Fable wv856 #3).
      - name: facturen-ingang.js moet lokaal blijven en geen JWT doorgeven
        if: ${{ !cancelled() }}
        run: |
          C=$(grep -vE '^\s*(\*|//)' facturen-ingang.js)
          if echo "$C" | grep -nE "require\([\`'\"](node:)?(http|https|net|tls|dgram|dns|child_process|worker_threads|cluster|vm|undici)[\`'\"]\)|\bfetch\s*\(|process\.(binding|dlopen)|import\(|console\."; then
            echo "::error::facturen-ingang.js laadt een netwerk- of procesmodule of logt naar de console"; exit 1
          fi
          if echo "$C" | grep -oE "require\([^)]*\)" | grep -vE "^require\('(fs|path|crypto)'\)$"; then
            echo "::error::facturen-ingang.js laadt een module buiten fs, path en crypto"; exit 1
          fi
          if echo "$C" | grep -niE "x-fac-gebruiker|cf-access-jwt-assertion" | grep -vE "controleerJwt\(String\(req\.headers\['(x-fac-gebruiker|cf-access-jwt-assertion)'\]"; then
            echo "::error::facturen-ingang.js gebruikt een JWT-kop buiten controleerJwt"; exit 1
          fi
          echo "facturen-ingang.js: alleen lokaal; JWT-koppen alleen naar controleerJwt."

      # De witte lijst en de handtekeningcontrole echt toetsen (nagebootste bunq en Enable Banking op 127.0.0.1); node:sqlite
      # vraagt Node 22 (zelfde hoofdversie als de pod).
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: '22'
      - name: bankluis-toetsen (Enable Banking + bunq)
        if: ${{ !cancelled() }}
        run: |
          # wv1044: elke toets draait, ook na een rode; de stap faalt aan het eind als er één rood was (namen in de annotaties).
          rood=0; t() { bash "$@" || { echo "::error::${TOETS_NU:+TOETS_NU=$TOETS_NU }$* rood"; rood=1; }; }
          t test/bunq-lezer.sh
          TOETS_NU=2026-12-15T23:30:00Z t test/bunq-lezer.sh   # wv1044: ook om 00:30 Nederlandse tijd, als de UTC-datum nog op gisteren staat (runs 241/242 rood)
          TOETS_NU=2027-04-10T22:30:00Z t test/bunq-lezer.sh   # wv1044: en na de zomertijdwissel (400 × 24 uur terug is dan geen 400 kalenderdagen)
          t test/bunq-poort.sh
          t test/bank-lezer.sh
          t test/bankluis-poort.sh
          t test/bank-ronde.sh
          # wv1225: de drie bankluis-toetsen ook op vaste momenten (toets én elk bank-lezer.js-kind op dezelfde klok): 00:30 NL met de UTC-datum
          # nog op gisteren, 1-1 00:30 NL (jaarwissel), na de zomertijdwissel, en op dag 1–9 van een maand
          for nu in 2026-12-15T23:30:00Z 2026-12-31T23:30:00Z 2027-04-10T22:30:00Z 2026-11-03T10:00:00Z; do
            for f in test/bunq-poort.sh test/bankluis-poort.sh test/bank-ronde.sh; do TOETS_NU=$nu t $f; done
          done
          t test/bank-archief.sh
          t test/vaste-lasten-ronde.sh   # wv776: maandronde vaste lasten (binnenblok vault, poort nieuwste post, box 1× per maand per reden)
          t test/paypal-laag.sh
          t test/bank-pot.sh   # wv786: POT-rekening afgescheiden van privé, indeling zonder taalmodel
          t test/financien-app.sh   # wv771: App Financiën — veld-allowlist, signalen, opzeglinks met host-allowlist
          TOETS_NU=2026-11-03T10:00:00Z t test/financien-app.sh   # wv1044: ook op dag 1–9 van een maand (een toetspost in de toekomst schoof de peildag op)
          t test/geld-briefing.sh   # wv777: Geld deze maand — signalen, dedupe, briefingdag, ronde (klok, poort, rij teruglezen, kaarten)
          pip install --quiet --user --break-system-packages mt-940==5.1.1 2>/dev/null || pip install --quiet mt-940==5.1.1 || echo "mt-940 niet te installeren: de onafhankelijke MT940-lezer wordt overgeslagen"
          t test/pot-verzend.sh   # wv911: POT-nota's als Gmail-concept — frontmatter, adres, PDF-controle, claim, onzeker-herstel, voorcontrole, kaarten
          t test/pot-auto.sh   # wv921: automatisch versturen — vrijgave, kaart-hash, venster zomer/winter/weekend/feestdag, onzeker nooit terug, plafond, twee pods
          t test/pot-auto-pod.sh   # wv921: knoproute (alleen knop-ja-vers-kaart, intrekken bij verval), verzendgeheim buiten de Socev-omgeving, noodstop
          t test/verzender-toetsen.sh   # wv921: Toetsen-code van AI - Facturen-verzender (bron pot, eigen geheim, witte lijst, cc, plafond) + hash in het image
          t test/pot-datahub.sh   # wv815: POT-posten naar Davids datahub — koppelen, grens, Davids vorm, toewijzing, grootboek, D1-batch met parameters
          t test/pot-app.sh   # wv1894: OVIS POT P1 — leesroutes van de POT-app als pod-module (padvorm, bundelen ≤ 2 rondgangen, alleen SELECT, verzonnen gegevens)
          t test/pot-app-schrijf.sh   # wv1933: OVIS POT P3/P4 — schrijfroutes en verzending (overgezette Function-toetsen, één transactie per route, schakelaar overstap, vingerafdruk bij adres)
          t test/pot-afschrift.sh   # wv787: POT-afschriften — MT940 (contractlezer + mt-940), saldoketen, verrijkte PDF, bank-lezer, maandronde
          exit $rood
